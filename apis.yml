aid: superlist
name: Superlist
description: >-
  Superlist is an AI-powered task and list management application from the team behind
  Wunderlist, combining to-dos, notes, and lightweight project planning in a single
  collaborative workspace across Mac, Web, iOS, and Android. Its primary programmatic
  surface is an official hosted Model Context Protocol (MCP) server that lets Claude,
  ChatGPT, Cursor, and any MCP-compatible agent read and manage tasks, lists, labels,
  and views over natural language. The MCP endpoint is secured with a standards-based
  OAuth 2.0 authorization server (PKCE, dynamic client registration, RFC 8414 / RFC 9728
  discovery). Superlist does not publish a traditional public REST API or OpenAPI; the
  MCP server is the agent-native integration layer.
